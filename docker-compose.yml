version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: demandiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: demandiq
      POSTGRES_USER: demandiq_user
      POSTGRES_PASSWORD: demandiq_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demandiq_user -d demandiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: demandiq_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: demandiq_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app/backend
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-demandiq-prod-docker-key
      - DB_ENGINE=postgres
      - DB_NAME=demandiq
      - DB_USER=demandiq_user
      - DB_PASSWORD=demandiq_secret
      - DB_HOST=db
      - DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: demandiq_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
